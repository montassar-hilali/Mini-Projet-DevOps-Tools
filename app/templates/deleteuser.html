{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header bg-danger text-white">
                <h1 class="h3 mb-0">
                    <i class="fas fa-user-minus me-2"></i>Delete User
                </h1>
            </div>
            <div class="card-body p-4">
                <div class="alert alert-warning">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <strong>Warning:</strong> Deleting a user will remove all their meeting bookings.
                </div>
                
                <form action="" method="post" class="needs-validation" novalidate>
                    {{ form.hidden_tag() }}
                    
                    <div class="mb-4">
                        <label for="{{ form.username.id }}" class="form-label fw-medium">
                            <i class="fas fa-user me-2"></i>{{ form.username.label }}
                        </label>
                        {{ form.username(class="form-select") }}
                        {% for error in form.username.errors %}
                        <div class="invalid-feedback d-block">{{ error }}</div>
                        {% endfor %}
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger py-2" onclick="return confirm('Are you sure you want to delete this user? This action cannot be undone.')">
                            <i class="fas fa-trash-alt me-2"></i>{{ form.submit.label }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
